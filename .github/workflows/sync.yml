name: Automated Hotel Calendar Sync

on:
  schedule:
    - cron: '0 */12 * * *' # Runs automatically every 12 hours
  workflow_dispatch: # Allows you to manually trigger it from GitHub anytime you want

jobs:
  sync-calendars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests icalendar gspread oauth2client

      - name: Create credentials file from secret
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > service_account.json

      - name: Run sync script
        run: python sync_script.py

      - name: Commit and push changes to GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add calendars/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync calendars: $(date +'%Y-%m-%d %H:%M')" && git push)
